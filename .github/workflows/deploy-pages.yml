name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'Public testing/**'
      - 'repo/**'
      - 'repo-beta/**'
      - 'resources/**'
      - '.github/scripts/generate_directory_indexes.py'
      - '.github/scripts/generate_kodi_repository.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate Kodi repository metadata and ZIPs
        run: python3 .github/scripts/generate_kodi_repository.py

      - name: Commit generated repository files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo repo-beta repository.e4kng_kodi_repo-stable.zip repository.e4kng_kodi_repo-beta.zip
          if ! git diff --cached --quiet; then
            git commit -m "Update generated Kodi repository metadata"
          fi

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' ./ _site/

      - name: Generate directory listings
        run: python3 .github/scripts/generate_directory_indexes.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
